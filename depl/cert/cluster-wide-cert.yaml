# this is a cluster wide certificate. it shall be created after the cert manager has been setup

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${CERT_NAME}
  namespace: ${CERT_NAMESPACE}
spec:
  secretName: ${CERT_SECRET_NAME}
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "${BASE_DOMAIN}"
    - "*.${BASE_DOMAIN}"