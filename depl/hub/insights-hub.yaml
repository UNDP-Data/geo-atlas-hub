apiVersion: v1
kind: Namespace
metadata:
  name: hub

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-hub
  namespace: hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insights-hub
  template:
    metadata:
      labels:
        app: insights-hub
    spec:
      containers:
      - name: web
        image: insights-hub:latest
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: hub-env
        ports:
        - containerPort: 80
        # 1. Mount the volume into the container at /app/src
        volumeMounts:
        - name: host-src-volume
          mountPath: /app/src
      # 2. Define the volume pulling from the KinD node's hostPath
      volumes:
      - name: host-src-volume
        hostPath:
          path: /app/src
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: insights-hub-svc
  namespace: hub
spec:
  selector:
    app: insights-hub
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: insights-hub-route
  namespace: hub
spec:
  parentRefs:
  - name: cluster-gateway
    namespace: default
  hostnames:
  - "insights.undpgeohub.org"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: insights-hub-svc
      port: 80