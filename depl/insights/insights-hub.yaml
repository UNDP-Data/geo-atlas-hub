apiVersion: v1
kind: Namespace
metadata:
  name: hub

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-hub
  namespace: hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insights-hub
  template:
    metadata:
      labels:
        app: insights-hub
    spec:
      containers:
      - name: web
        image: insights-hub:latest
        imagePullPolicy: IfNotPresent # Crucial for using the locally loaded KinD image
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: insights-hub-svc
  namespace: hub
spec:
  selector:
    app: insights-hub
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: insights-hub-route
  namespace: hub
spec:
  parentRefs:
  - name: cluster-gateway
    namespace: default
  hostnames:
  - "insights.undpgeohub.org" # Adjust to your desired local test domain
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: insights-hub-svc
      port: 80