# 1. Create the permanent namespace
apiVersion: v1
kind: Namespace
metadata:
  name: marimo
---
# 2. Define the permissions in the target namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: marimo # The namespace where you are spawning the notebooks
  name: insightshub-spawner-role
rules:
- apiGroups: ["batch", "extensions"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["services", "pods"]
  verbs: ["create", "get", "list", "watch", "delete"]

# This is the section added for the Gateway API (HTTPRoute)
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["create", "get", "list", "watch", "delete"]

---
# 2. Grant these permissions to your InsightsHub pod
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insightshub-spawner-binding
  namespace: marimo
subjects:
- kind: ServiceAccount
  name: default       # Change this if your InsightsHub pod uses a custom ServiceAccount
  namespace: hub      # The namespace where your InsightsHub UI pod is currently running
roleRef:
  kind: Role
  name: insightshub-spawner-role
  apiGroup: rbac.authorization.k8s.io